[project]
name = "investment-analyzer"
version = "0.1.0"
description = "Lokaler Investment-Research-Analysator (Research-/Simulationsmodus, keine Anlageberatung)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "streamlit>=1.38",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "httpx>=0.27",
    "pandas>=2.2",
    "numpy>=1.26",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "plotly>=5.23",
    "apscheduler>=3.10",
    "keyring>=25.2",
    "cryptography>=43.0",
    "playwright>=1.46",
    "openpyxl>=3.1",
    "reportlab>=4.2",
    "python-dateutil>=2.9",
    "defusedxml>=0.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-python-dateutil",
    "freezegun>=1.5",
]
postgres = [
    "psycopg[binary]>=3.2",
]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["investment_analyzer"]
strict = false
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "slow: langsamere Tests (z. B. echte Alembic-Migration per Subprozess).",
]
